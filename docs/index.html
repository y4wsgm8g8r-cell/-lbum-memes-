<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMES & IMAGES BY METAFXN</title>
<style>
:root { --bg:#111; --card:#1b1b1b; --text:#f2f2f2; --accent:#e8b04b; }
* { box-sizing: border-box; }
body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
header { padding: 32px 20px 12px; text-align:center; }
header h1 { margin:0; font-weight:600; letter-spacing:0.5px; }
header p { opacity:0.6; margin-top:6px; font-size:14px; }
.grid { display:grid; gap:4px; padding:8px; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
.foto { position:relative; display:block; overflow:hidden; border-radius:6px; background: var(--card); aspect-ratio: 1/1; }
.foto img { width:100%; height:100%; object-fit:cover; display:block; transition: transform .3s ease; }
.foto:hover img { transform: scale(1.06); }
.play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:26px; color:#fff; text-shadow:0 0 8px rgba(0,0,0,0.85); pointer-events:none; }
#lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); align-items:center; justify-content:center; z-index:50; flex-direction:column; }
#lightbox.abierto { display:flex; }
#lightbox-content img, #lightbox-content video { max-width:92vw; max-height:82vh; border-radius:8px; }
.controles { margin-top:16px; display:flex; gap:24px; }
.controles button { background:none; border:1px solid #555; color:var(--text); font-size:16px; padding:8px 18px; border-radius:20px; cursor:pointer; }
.controles button:hover { border-color: var(--accent); color: var(--accent); }
.cerrar { position:absolute; top:20px; right:24px; font-size:28px; cursor:pointer; }
footer { text-align:center; padding:24px; opacity:0.4; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>MEMES & IMAGES BY METAFXN</h1>
  <p>11 elementos</p>
</header>
<div class="grid">
      <a href="photos/full/item_0001.jpg" class="foto" data-index="0" data-tipo="imagen">
        <img src="photos/thumb/item_0001.jpg" alt="Elemento 1" loading="lazy">
      </a>
      <a href="photos/full/item_0002.jpg" class="foto" data-index="1" data-tipo="imagen">
        <img src="photos/thumb/item_0002.jpg" alt="Elemento 2" loading="lazy">
      </a>
      <a href="photos/full/item_0003.jpg" class="foto" data-index="2" data-tipo="imagen">
        <img src="photos/thumb/item_0003.jpg" alt="Elemento 3" loading="lazy">
      </a>
      <a href="photos/full/item_0004.jpg" class="foto" data-index="3" data-tipo="imagen">
        <img src="photos/thumb/item_0004.jpg" alt="Elemento 4" loading="lazy">
      </a>
      <a href="photos/full/item_0005.jpg" class="foto" data-index="4" data-tipo="imagen">
        <img src="photos/thumb/item_0005.jpg" alt="Elemento 5" loading="lazy">
      </a>
      <a href="photos/full/item_0006.jpg" class="foto" data-index="5" data-tipo="imagen">
        <img src="photos/thumb/item_0006.jpg" alt="Elemento 6" loading="lazy">
      </a>
      <a href="photos/full/item_0007.jpg" class="foto" data-index="6" data-tipo="imagen">
        <img src="photos/thumb/item_0007.jpg" alt="Elemento 7" loading="lazy">
      </a>
      <a href="photos/full/item_0008.jpg" class="foto" data-index="7" data-tipo="imagen">
        <img src="photos/thumb/item_0008.jpg" alt="Elemento 8" loading="lazy">
      </a>
      <a href="photos/full/item_0009.jpg" class="foto" data-index="8" data-tipo="imagen">
        <img src="photos/thumb/item_0009.jpg" alt="Elemento 9" loading="lazy">
      </a>
      <a href="photos/full/item_0010.jpg" class="foto" data-index="9" data-tipo="imagen">
        <img src="photos/thumb/item_0010.jpg" alt="Elemento 10" loading="lazy">
      </a>
      <a href="photos/full/item_0011.jpg" class="foto" data-index="10" data-tipo="imagen">
        <img src="photos/thumb/item_0011.jpg" alt="Elemento 11" loading="lazy">
      </a>
</div>
<div id="lightbox">
  <span class="cerrar" onclick="cerrar()">&times;</span>
  <div id="lightbox-content"></div>
  <div class="controles">
    <button onclick="mover(-1)">&larr; Anterior</button>
    <button onclick="mover(1)">Siguiente &rarr;</button>
  </div>
</div>
<footer>ALADDINDAO</footer>
<script>
var fotos = document.querySelectorAll('.foto');
var lightbox = document.getElementById('lightbox');
var lightboxContent = document.getElementById('lightbox-content');
var actual = 0;
fotos.forEach(function(a) {
  a.addEventListener('click', function(e) {
    e.preventDefault();
    actual = parseInt(a.dataset.index);
    abrir();
  });
});
function abrir() {
  var a = fotos[actual];
  var tipo = a.dataset.tipo;
  var src = a.getAttribute('href');
  if (tipo === 'video') {
    lightboxContent.innerHTML = '<video src="' + src + '" controls autoplay></video>';
  } else {
    lightboxContent.innerHTML = '<img src="' + src + '">';
  }
  lightbox.classList.add('abierto');
}
function cerrar() {
  lightbox.classList.remove('abierto');
  lightboxContent.innerHTML = '';
}
function mover(delta) {
  actual = (actual + delta + fotos.length) % fotos.length;
  abrir();
}
document.addEventListener('keydown', function(e) {
  if (!lightbox.classList.contains('abierto')) return;
  if (e.key === 'Escape') cerrar();
  if (e.key === 'ArrowRight') mover(1);
  if (e.key === 'ArrowLeft') mover(-1);
});
lightbox.addEventListener('click', function(e) {
  if (e.target === lightbox) cerrar();
});
</script>
</body>
</html>
